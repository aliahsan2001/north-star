<script>
  // Opened straight from disk: browsers block the site's modules there, so explain instead of showing a broken page
  if (location.protocol === 'file:') document.addEventListener('DOMContentLoaded', function () {
    document.body.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#070d24;color:#fff8e1;font:18px/1.6 system-ui,sans-serif;padding:24px">' +
      '<div style="max-width:540px"><p style="color:#ffd23f;letter-spacing:.16em;font-size:13px;font-weight:700">NORTHSTAR ACADEMY</p>' +
      '<h1 style="font-size:32px;line-height:1.15;margin:10px 0 14px">This site needs to run from a local server</h1>' +
      '<p>It uses modern JavaScript modules, which browsers block when a page is opened straight from a file.</p>' +
      '<p style="margin-top:14px">Run <code style="background:#16224d;padding:2px 6px;border-radius:4px">npm run dev</code>. Once deployed on Vercel it works normally.</p></div></div>';
  });
</script>
